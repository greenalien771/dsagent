name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, and that pool is the one GitHub documents as
        # capacity-constrained: on run 40373502766 the job was never acquired
        # ("The job was not acquired by Runner of type hosted even after multiple
        # attempts") and was cancelled after ~15 minutes without running a single
        # step. macos-15-intel is the x64 macOS image, a far larger pool. macOS
        # coverage matters more than macOS-on-arm64; switch this back to
        # macos-latest once the arm64 queue stops deciding whether the job runs.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned to the version declared in go.mod, so the stated minimum is
          # the version actually exercised.
          go-version-file: go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # The build tags matter: a Windows-only syscall (SysProcAttr.CmdLine) sat in
      # tools.go untagged, so `go vet` passed here on Windows and failed on the
      # first unix runner it ever reached. Vetting the other targets on Linux
      # catches that class in ~5 seconds without waiting for the matrix.
      - name: cross-vet
        if: runner.os == 'Linux'
        run: |
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...

      - run: go vet ./...

      - run: go build ./...

      # A failing test on a runner whose log nobody can open is a dead end: the
      # job log needs a token, so all a reader of the checks API gets is "exit
      # code 1". Re-emitting each failure as an ::error annotation puts the test
      # name and the assertion into check-runs, which is readable without
      # credentials.
      - name: go test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          status=0
          go test ./... 2>&1 | tee /tmp/go-test.log || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|^panic:' /tmp/go-test.log \
              | head -30 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi

      - run: go test ./...
        if: runner.os == 'Windows'
