<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" role="img" aria-label="dsagent">
  <title>dsagent</title>
  <!-- The dsagent mark: a sandbox cell (hexagon) holding a shell prompt
       (chevron + caret). The hexagon is the box the agent is confined to;
       the prompt is what it does inside it.
       This geometry is duplicated inline in ui/index.html at two sizes:
         - title bar, 16px: frame 1.7, prompt 2.3 (heavier, it is drawn tiny)
         - hero, 44px:      frame 1.1, prompt 1.5
       Change all three together. -->
  <g fill="none" stroke="#98a1a9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.6 20.4 7.4v9.2L12 21.4 3.6 16.6V7.4z" stroke-width="1.5"/>
    <path d="M8.2 8.7l3.5 3.3-3.5 3.3M13.3 15.3h2.8" stroke-width="2"/>
  </g>
</svg>
